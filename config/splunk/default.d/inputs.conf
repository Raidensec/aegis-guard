# =============================================================================
# Splunk inputs.conf — AI-SOC integration
# Mounted into /opt/splunk/etc/apps/search/local/inputs.conf inside the container
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP Event Collector (HEC) — receives enriched AI-SOC JSON events
# ---------------------------------------------------------------------------
[http]
disabled = 0
enableSSL = 0
port = 8088

[http://ai_soc_hec]
disabled = 0
index = ai_soc
sourcetype = ai_soc:enriched
token = CHANGE_ME_SPLUNK_HEC_TOKEN

# ---------------------------------------------------------------------------
# Syslog (UDP) — receives raw Wazuh syslog_output events
# ---------------------------------------------------------------------------
[udp://1514]
disabled = 0
connection_host = ip
sourcetype = wazuh:syslog
index = wazuh
