# =============================================================================
# Splunk indexes.conf — AI-SOC integration
# Creates dedicated indexes for Wazuh raw events and AI-enriched context
# =============================================================================

[ai_soc]
homePath   = $SPLUNK_DB/ai_soc/db
coldPath   = $SPLUNK_DB/ai_soc/colddb
thawedPath = $SPLUNK_DB/ai_soc/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 2592000

[wazuh]
homePath   = $SPLUNK_DB/wazuh/db
coldPath   = $SPLUNK_DB/wazuh/colddb
thawedPath = $SPLUNK_DB/wazuh/thaweddb
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 7776000
